apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  labels: {app.kubernetes.io/name: product-api}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: product-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: product-api}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: product-api
          image: product-api
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080, name: http}]
          envFrom: [{configMapRef: {name: product-api-config}}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: product-api-db, key: url}}
            - name: DATABASE_USERNAME
              valueFrom: {secretKeyRef: {name: product-api-db, key: username}}
            - name: DATABASE_PASSWORD
              valueFrom: {secretKeyRef: {name: product-api-db, key: password}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
