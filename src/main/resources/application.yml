spring:
  application:
    name: product-api
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
info:
  app:
    name: Product API
    version: 1.0.0
