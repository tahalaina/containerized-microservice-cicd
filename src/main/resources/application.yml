spring:
  application:
    name: product-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/products}
    username: ${DATABASE_USERNAME:products}
    password: ${DATABASE_PASSWORD:products}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
info:
  app:
    name: Product API
    version: 1.0.0
